[package]
name = "freetier-rotate-middleware"
version = "2.0.0"
edition = "2021"
# Floor set by the dependency tree, not by this crate's own code:
# icu_* (via url -> reqwest) requires 1.88. Recompute with `cargo metadata`
# before lowering it.
rust-version = "1.88"

[dependencies]
axum = { version = "0.7", features = ["http2", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
bytes = "1"
async-stream = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }

rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
nanoid = "0.4"
parking_lot = "0.12"
arc-swap = "1"

[dev-dependencies]
tempfile = "3"
